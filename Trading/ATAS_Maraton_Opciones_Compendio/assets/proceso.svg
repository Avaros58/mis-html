<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-label="Proceso de la estrategia en prueba"><title>Proceso de la estrategia en prueba</title><rect width="1000" height="520" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#142b3a;font-size:23px}.small{font-size:19px;fill:#445661}.head{font-size:27px;font-weight:bold}.rust{fill:#974036}.teal{fill:#17665f}.line{stroke:#cad4d8;stroke-width:1}.route{fill:none;stroke-width:4;stroke-linejoin:round;stroke-linecap:round}</style><text x="35" y="45" class="head">De los datos a un resultado revisable</text><rect x="40" y="110" width="285" height="100" fill="#e9eff2"/><text x="56" y="145" class="head">01  Datos</text><text x="56" y="184" class="small">Contrato y reloj</text><text x="332" y="165" class="">→</text><rect x="360" y="110" width="285" height="100" fill="#e9eff2"/><text x="376" y="145" class="head">02  Rango</text><text x="376" y="184" class="small">Fijar H y L</text><text x="652" y="165" class="">→</text><rect x="680" y="110" width="285" height="100" fill="#e9eff2"/><text x="696" y="145" class="head">03  Ruptura</text><text x="696" y="184" class="small">Cierre fuera</text><rect x="40" y="280" width="285" height="100" fill="#e9eff2"/><text x="56" y="315" class="head">04  Retesteo</text><text x="56" y="354" class="small">Confirmación</text><text x="332" y="335" class="">→</text><rect x="360" y="280" width="285" height="100" fill="#e9eff2"/><text x="376" y="315" class="head">05  Exposición</text><text x="376" y="354" class="small">Fill, stop y costes</text><text x="652" y="335" class="">→</text><rect x="680" y="280" width="285" height="100" fill="#e9eff2"/><text x="696" y="315" class="head">06  Revisión</text><text x="696" y="354" class="small">Resultado y límites</text><text x="40" y="455" class="small">Si falta una condición: cancelar, esperar o registrar dato indeterminado.</text><text class="small" x="35" y="498">ESQUEMA PROPIO · Datos ficticios o relaciones conceptuales</text></svg>