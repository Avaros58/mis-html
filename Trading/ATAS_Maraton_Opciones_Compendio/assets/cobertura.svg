<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-label="Dos sentidos posibles de cobertura"><title>Dos sentidos posibles de cobertura</title><rect width="1000" height="520" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#142b3a;font-size:23px}.small{font-size:19px;fill:#445661}.head{font-size:27px;font-weight:bold}.rust{fill:#974036}.teal{fill:#17665f}.line{stroke:#cad4d8;stroke-width:1}.route{fill:none;stroke-width:4;stroke-linejoin:round;stroke-linecap:round}</style><text x="35" y="45" class="head">El signo de gamma cambia el reajuste</text><rect x="35" y="105" width="930" height="135" fill="#f0f3f4"/><text x="60" y="140" class="head">Libro gamma negativo</text><text x="60" y="190" class="">Sube → comprar más</text><text x="530" y="190" class="">Baja → vender cobertura</text><line x1="60" y1="215" x2="920" y2="215" stroke="#974036" stroke-width="3" stroke-dasharray=""/><rect x="35" y="285" width="930" height="135" fill="#f0f3f4"/><text x="60" y="320" class="head">Libro gamma positivo</text><text x="60" y="370" class="">Sube → vender más</text><text x="530" y="370" class="">Baja → comprar cobertura</text><line x1="60" y1="395" x2="920" y2="395" stroke="#17665f" stroke-width="3" stroke-dasharray=""/><text x="35" y="465" class="small">Supuestos: delta neutral, ajuste local, tiempo e IV constantes.</text><text class="small" x="35" y="498">ESQUEMA PROPIO · Datos ficticios o relaciones conceptuales</text></svg>