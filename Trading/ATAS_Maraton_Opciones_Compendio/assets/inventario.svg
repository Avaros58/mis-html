<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-label="Abrir, transferir y cerrar"><title>Abrir, transferir y cerrar</title><rect width="1000" height="520" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#142b3a;font-size:23px}.small{font-size:19px;fill:#445661}.head{font-size:27px;font-weight:bold}.rust{fill:#974036}.teal{fill:#17665f}.line{stroke:#cad4d8;stroke-width:1}.route{fill:none;stroke-width:4;stroke-linejoin:round;stroke-linecap:round}</style><text x="35" y="45" class="head">Volumen es actividad; OI es inventario</text><text x="45" y="120" class="head">Abrir</text><rect x="45" y="160" width="275" height="145" fill="#e9eff2"/><text x="65" y="210" class="">Volumen: 1</text><text x="65" y="260" class="">OI: 1</text><text x="45" y="355" class="small">Ambas partes abren</text><text x="360" y="120" class="head">Transferir</text><rect x="360" y="160" width="275" height="145" fill="#e9eff2"/><text x="380" y="210" class="">Volumen: 2</text><text x="380" y="260" class="">OI: 1</text><text x="360" y="355" class="small">Una abre; otra cierra</text><text x="675" y="120" class="head">Cerrar</text><rect x="675" y="160" width="275" height="145" fill="#e9eff2"/><text x="695" y="210" class="">Volumen: 3</text><text x="695" y="260" class="">OI: 0</text><text x="675" y="355" class="small">Ambas partes cierran</text><text x="45" y="425" class="">Un contrato tiene comprador y vendedor; se cuenta una sola vez.</text><text class="small" x="35" y="498">ESQUEMA PROPIO · Datos ficticios o relaciones conceptuales</text></svg>