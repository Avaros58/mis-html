<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-label="Tres rutas desde una zona de interés"><title>Tres rutas desde una zona de interés</title><rect width="1000" height="520" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#142b3a;font-size:23px}.small{font-size:19px;fill:#445661}.head{font-size:27px;font-weight:bold}.rust{fill:#974036}.teal{fill:#17665f}.line{stroke:#cad4d8;stroke-width:1}.route{fill:none;stroke-width:4;stroke-linejoin:round;stroke-linecap:round}</style><text x="35" y="45" class="head">Una zona, tres respuestas posibles</text><rect x="65" y="145" width="270" height="45" fill="#e9eff2"/><text x="65" y="95" class="">Regreso</text><path d="M 95 225 L 150 195 L 195 130 L 220 160 L 250 260 L 285 290" class="route" stroke="#17665f"/><text x="65" y="355" class="small">Vuelve al interior</text><text x="65" y="395" class="small">No es una entrada</text><rect x="375" y="145" width="270" height="45" fill="#e9eff2"/><text x="375" y="95" class="">Continuidad</text><path d="M 400 260 L 450 220 L 495 150 L 535 180 L 570 120 L 605 85" class="route" stroke="#974036"/><text x="375" y="355" class="small">Sostiene el exterior</text><text x="375" y="395" class="small">No es una entrada</text><rect x="685" y="145" width="270" height="45" fill="#e9eff2"/><text x="685" y="95" class="">Equilibrio</text><path d="M 720 265 L 760 220 L 800 160 L 830 180 L 850 145 L 880 180 L 910 155" class="route" stroke="#142b3a"/><text x="685" y="355" class="small">Oscila en la zona</text><text x="685" y="395" class="small">No es una entrada</text><text class="small" x="35" y="498">ESQUEMA PROPIO · Datos ficticios o relaciones conceptuales</text></svg>