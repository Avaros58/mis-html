<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 475" role="img" aria-labelledby="t d"><title id="t">Dos perfiles de almuerzo; dos lecturas</title><desc id="d">Esquema propio · NY 12:00–13:00 · Trazos conceptuales, sin escala de precios.</desc><style>text{font-family:Segoe UI,Arial,sans-serif}</style><rect width="1000" height="475" fill="#faf8f2"/><text x="35" y="47" font-size="28" fill="#173d48" font-weight="600">Dos perfiles de almuerzo; dos lecturas</text><text x="40" y="100" font-size="22" fill="#173d48" font-weight="600">A. Consolidación y barrido posterior</text><text x="535" y="100" font-size="22" fill="#173d48" font-weight="600">B. Retroceso activo hacia una zona</text><rect x="140" y="130" width="150" height="160" rx="8" fill="#e9eeeb" stroke="#cbd3d2"/><rect x="640" y="130" width="150" height="160" rx="8" fill="#e9eeeb" stroke="#cbd3d2"/><text x="150" y="158" font-size="18" fill="#173d48" font-weight="400">Almuerzo</text><text x="650" y="158" font-size="18" fill="#173d48" font-weight="400">Almuerzo</text><path d="M50 270 L100 205 L140 220 L175 200 L215 222 L245 204 L285 217 L330 285 L360 207 L410 150 L465 110" fill="none" stroke="#173d48" stroke-width="4"/><path d="M545 130 L590 170 L625 158 L660 208 L700 228 L745 210 L790 257 L825 200 L880 145 L940 112" fill="none" stroke="#9b4e32" stroke-width="4"/><path d="M590 240 L940 240" stroke="#9b4e32" stroke-width="3" stroke-dasharray="7 5"/><text x="600" y="285" font-size="18" fill="#173d48" font-weight="400">Zona de contexto / FVG</text><text x="40" y="355" font-size="21" fill="#173d48" font-weight="400">Mínimos del rango → toma → respuesta</text><text x="535" y="355" font-size="21" fill="#173d48" font-weight="400">Caída a zona → mínimo local → respuesta</text><text x="40" y="405" font-size="22" fill="#173d48" font-weight="400">No exigir una consolidación que no aparece.</text><text x="35" y="452" font-size="17" fill="#173d48" font-weight="400">Esquema propio · NY 12:00–13:00 · Trazos conceptuales, sin