<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d"><title id="t">Avance hacia objetivo y recorte del stop</title><desc id="d">Reconstrucción condicionada · T = 3.780,25 · Regla de tick del 75 %: ampliación propia.</desc><style>text{font-family:Segoe UI,Arial,sans-serif}</style><rect width="1000" height="560" fill="#faf8f2"/><text x="35" y="47" font-size="28" fill="#173d48" font-weight="600">Avance hacia objetivo y recorte del stop</text><text x="40" y="100" font-size="23" fill="#173d48" font-weight="600">Trayecto esperado: 25,50 puntos</text><path d="M85 177 L930 177" stroke="#173d48" stroke-width="3" /><path d="M85 166 L85 188" stroke="#9b4e32" stroke-width="3" /><text x="45" y="136" font-size="19" fill="#173d48" font-weight="400">Entrada</text><text x="45" y="218" font-size="20" fill="#173d48" font-weight="400">3.754,75</text><path d="M507 166 L507 188" stroke="#9b4e32" stroke-width="3" /><text x="467" y="136" font-size="19" fill="#173d48" font-weight="400">50 %</text><text x="467" y="218" font-size="20" fill="#173d48" font-weight="400">3.767,50</text><path d="M719 166 L719 188" stroke="#9b4e32" stroke-width="3" /><text x="679" y="136" font-size="19" fill="#173d48" font-weight="400">75 % ≥</text><text x="679" y="218" font-size="20" fill="#173d48" font-weight="400">3.774,00</text><path d="M930 166 L930 188" stroke="#9b4e32" stroke-width="3" /><text x="830" y="136" font-size="19" fill="#173d48" font-weight="400">Objetivo</text><text x="830" y="218" font-size="20" fill="#173d48" font-weight="400">3.780,25</text><rect x="40" y="265" width="290" height="142" rx="8" fill="#e9eeeb" stroke="#cbd3d2"/><text x="60" y="303" font-size="22" fill="#173d48" font-weight="600">Antes del avance</text><text x="60" y="345" font-size="24" fill="#173d48" font-weight="400">S = 3.745,75</text><text x="60" y="380" font-size="20" fill="#173d48" font-weight="400">Distancia: 9 puntos</text><rect x="355" y="265" width="290" height="142" rx="8" fill="#e9eeeb" stroke="#cbd3d2"/><text x="375" y="303" font-size="22" fill="#173d48" font-weight="600">Al alcanzar 50 %</text><text x="375" y="345" font-size="24" fill="#173d48" font-weight="400">S = 3.748,00</text><text x="375" y="380" font-size="20" fill="#173d48" font-weight="400">Distancia: 6,75 puntos</text><rect x="670" y="265" width="290" height="142" rx="8" fill="#e9d8c6" stroke="#cbd3d2"/><text x="690" y="303" font-size="22" fill="#173d48" font-weight="600">Al alcanzar 75 %</text><text x="690" y="345" font-size="24" fill="#173d48" font-weight="400">S = entrada</text><text x="690" y="380" font-size="20" fill="#173d48" font-weight="400">Break-even nominal</text><text x="40" y="457" font-size="22" fill="#173d48" font-weight="400">El stop sube 2,25 puntos: 25 % de los nueve puntos iniciales.</text><text x="40" y="494" font-size="20" fill="#173d48" font-weight="400">No se amplía otra vez ni se redefine T para retrasar el disparador.</text><text x="35" y="537" font-size="17" fill="#173d48" font-weight="400">Reconstrucción condicionada · T = 3.780,25 · Regla de tick del 75 %: ampliación propia.</text></svg>