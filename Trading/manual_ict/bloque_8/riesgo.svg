<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t d"><title id="t">El presupuesto decide la cantidad</title><desc id="d">Ejemplo propio · C = 10.000 USD · Stop = 9 puntos · Reserva ficticia de 5 USD/MES.</desc><style>text{font-family:Segoe UI,Arial,sans-serif}</style><rect width="1000" height="520" fill="#faf8f2"/><text x="35" y="47" font-size="28" fill="#173d48" font-weight="600">El presupuesto decide la cantidad</text><rect x="40" y="90" width="920" height="68" rx="8" fill="#e9d8c6" stroke="#cbd3d2"/><text x="65" y="133" font-size="26" fill="#173d48" font-weight="600">Presupuesto nominal del 1 %: 100 USD</text><rect x="40" y="190" width="440" height="170" rx="8" fill="#e9eeeb" stroke="#cbd3d2"/><text x="65" y="230" font-size="25" fill="#173d48" font-weight="600">Un ES: 9 × 50 = 450 USD</text><text x="65" y="273" font-size="20" fill="#173d48" font-weight="400">Supera 100 USD incluso sin costes.</text><text x="65" y="320" font-size="20" fill="#173d48" font-weight="400">No cabe → no aumentar el riesgo.</text><rect x="520" y="190" width="440" height="170" rx="8" fill="#e9eeeb" stroke="#cbd3d2"/><text x="545" y="230" font-size="24" fill="#173d48" font-weight="600">Un MES: 9 × 5 + 5 = 50 USD</text><text x="545" y="273" font-size="20" fill="#173d48" font-weight="400">Dos MES: 100 USD planificados.</text><text x="545" y="320" font-size="20" fill="#173d48" font-weight="400">Tres MES: 150 USD → no caben.</text><text x="55" y="413" font-size="23" fill="#173d48" font-weight="400">A 0,5 %: 50 USD → un MES. A 0,25 %: 25 USD → ninguno.</text><text x="55" y="450" font-size="20" fill="#173d48" font-weight="400">Redondear hacia abajo; margen disponible no equivale a riesgo admisible.</text><text x="35" y="497" font-size="17" fill="#173d48" font-weight="400">Ejemplo propio · C = 10.000 USD · Stop = 9 puntos · Reserva ficticia de 5 USD/MES.</text></svg>