<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 465" role="img" aria-labelledby="t d"><title id="t">De una previsión a una decisión</title><desc id="d">Esquema propio · Sin cotizaciones · La abstención es un resultado documentable.</desc><style>text{font-family:Segoe UI,Arial,sans-serif}</style><rect width="1000" height="465" fill="#faf8f2"/><text x="35" y="47" font-size="28" fill="#173d48" font-weight="600">De una previsión a una decisión</text><rect x="40" y="85" width="430" height="100" rx="8" fill="#e9eeeb" stroke="#cbd3d2"/><text x="60" y="122" font-size="23" fill="#173d48" font-weight="600">1. Contexto y destino definidos</text><text x="60" y="157" font-size="18" fill="#173d48" font-weight="400">¿Qué tendría que ocurrir y qué lo invalidaría?</text><rect x="530" y="85" width="430" height="100" rx="8" fill="#e9eeeb" stroke="#cbd3d2"/><text x="550" y="122" font-size="23" fill="#173d48" font-weight="600">2. Variante y ventana identificadas</text><text x="550" y="157" font-size="18" fill="#173d48" font-weight="400">¿Aparecen sus condiciones antes de entrar?</text><text x="486" y="145" font-size="30" fill="#173d48" font-weight="400">→</text><rect x="40" y="240" width="430" height="100" rx="8" fill="#e9eeeb" stroke="#cbd3d2"/><text x="60" y="277" font-size="23" fill="#173d48" font-weight="600">3. Riesgo y cantidad compatibles</text><text x="60" y="312" font-size="18" fill="#173d48" font-weight="400">Stop, distancia, costes y cantidad entera</text><rect x="530" y="240" width="430" height="100" rx="8" fill="#e9d8c6" stroke="#cbd3d2"/><text x="550" y="277" font-size="22" fill="#173d48" font-weight="600">4. Ejecución de estudio o abstención</text><text x="550" y="312" font-size="18" fill="#173d48" font-weight="400">Registrar orden, revisión y resultado real</text><text x="486" y="300" font-size="30" fill="#173d48" font-weight="400">→</text><text x="60" y="398" font-size="22" fill="#173d48" font-weight="400">Si falta una condición, no se inventa después de conocer el desenlace.</text><text x="35" y="442" font-size="17" fill="#173d48" font-weight="400">Esquema propio · Sin cotizaciones · La abstención es un resultado documentable.</text></svg>