<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-labelledby="t d"><title id="t">Una coordenada semanal, dos funciones locales</title><desc id="d">Esquema propio · Sin escala de precios · Observar la respuesta y la narrativa.</desc><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#173d48} .small{font-size:18px}.label{font-size:22px;font-weight:600}</style><rect width="100%" height="100%" fill="#faf8f2"/><text x="35" y="44" font-size="27" font-weight="600">Una coordenada semanal, dos funciones locales</text><rect x="55" y="190" width="890" height="55" fill="#e9d8c6"/><text x="65" y="224" class="small">Zona del Sunday Opening Gap extendida</text><path d="M80 310 L160 265 L215 360 L290 280 L330 310 L415 230 L485 160 L560 190 L630 105 L710 180 L810 80" fill="none" stroke="#173d48" stroke-width="5"/><text x="65" y="130" class="label">Por debajo: referencia de resistencia</text><text x="505" y="345" class="label">Por encima: referencia de soporte</text><text x="65" y="385" class="small">El contacto no es una entrada automática.</text><text x="35" y="438" class="small">Esquema propio · Sin escala de precios · Observar la respuesta y la narrativa.</text></svg>