<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 670" role="img" aria-label="Dos contextos · la confirmación sigue siendo necesaria"><title>Dos contextos · la confirmación sigue siendo necesaria</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#9b4e32"/></marker></defs><rect width="900" height="670" fill="#fff"/><g font-family="Segoe UI,Arial,sans-serif"><text x="35" y="47" font-size="28" fill="#173d48">Dos contextos · la confirmación sigue siendo necesaria</text><rect x="45" y="90" width="380" height="150" rx="10" fill="#e9eff2"/><text x="65" y="127" font-size="25" fill="#173d48">A · Extremo anterior</text><text x="65" y="168" font-size="21" fill="#173d48">Toma de un máximo</text><text x="65" y="198" font-size="21" fill="#173d48">o de un mínimo previo</text><rect x="475" y="90" width="380" height="150" rx="10" fill="#e9eff2"/><text x="495" y="127" font-size="25" fill="#173d48">B · FVG contextual</text><text x="495" y="168" font-size="21" fill="#173d48">Visita a un desequilibrio</text><text x="495" y="198" font-size="21" fill="#173d48">previo de interés</text><path d="M235 250 L380 315" stroke="#9b4e32" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M665 250 L520 315" stroke="#9b4e32" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="185" y="335" width="530" height="135" rx="10" fill="#e9eff2"/><text x="205" y="372" font-size="25" fill="#173d48">Desplazamiento y ruptura</text><text x="205" y="413" font-size="21" fill="#173d48">Identificar el nuevo FVG del impulso</text><path d="M450 480 L450 525" stroke="#9b4e32" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="115" y="563" font-size="24" fill="#173d48">Solo después: estudiar el retroceso y la ejecución.</text><text x="115" y="600" font-size="21" fill="#173d48">Tocar el FVG previo no equivale a activar una entrada.</text><text x="35" y="646" font-size="18" fill="#9b4e32">Esquema propio · no es una captura de mercado</text></g></svg>