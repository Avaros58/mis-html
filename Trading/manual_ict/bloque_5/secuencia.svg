<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" role="img" aria-label="Cuatro preguntas antes de una entrada"><title>Cuatro preguntas antes de una entrada</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#9b4e32"/></marker></defs><rect width="900" height="650" fill="#fff"/><g font-family="Segoe UI,Arial,sans-serif"><text x="35" y="47" font-size="28" fill="#173d48">Cuatro preguntas antes de una entrada</text><rect x="45" y="88" width="355" height="145" rx="10" fill="#e9eff2"/><text x="65" y="125" font-size="25" fill="#173d48">1 · Contexto</text><text x="65" y="166" font-size="21" fill="#173d48">¿Qué recorrido se estudia?</text><text x="65" y="196" font-size="21" fill="#173d48">¿Qué lo pondría en duda?</text><rect x="500" y="88" width="355" height="145" rx="10" fill="#e9eff2"/><text x="520" y="125" font-size="25" fill="#173d48">2 · Ubicación</text><text x="520" y="166" font-size="21" fill="#173d48">¿En qué zona se observará</text><text x="520" y="196" font-size="21" fill="#173d48">la posible reacción?</text><rect x="500" y="302" width="355" height="145" rx="10" fill="#e9eff2"/><text x="520" y="339" font-size="25" fill="#173d48">3 · Confirmación</text><text x="520" y="380" font-size="21" fill="#173d48">¿Aparece el desplazamiento</text><text x="520" y="410" font-size="21" fill="#173d48">que exige el protocolo?</text><rect x="45" y="302" width="355" height="145" rx="10" fill="#e9eff2"/><text x="65" y="339" font-size="25" fill="#173d48">4 · Ejecución</text><text x="65" y="380" font-size="21" fill="#173d48">Entrada, invalidación,</text><text x="65" y="410" font-size="21" fill="#173d48">cantidad, salida y vigencia</text><path d="M410 157 L488 157" stroke="#9b4e32" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M678 245 L678 286" stroke="#9b4e32" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M490 373 L412 373" stroke="#9b4e32" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="45" y="495" width="810" height="82" fill="#f4e5d6"/><text x="68" y="530" font-size="23" fill="#173d48">Sin confirmación: observar, cancelar o revisar la hipótesis.</text><text x="68" y="560" font-size="21" fill="#173d48">Acertar la dirección no completa una condición ausente.</text><text x="35" y="626" font-size="18" fill="#9b4e32">Esquema propio · no es una captura de mercado</text></g></svg>