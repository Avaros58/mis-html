<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" role="img" aria-label="El rango elegido decide la prima y el descuento"><title>El rango elegido decide la prima y el descuento</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#9b4e32"/></marker></defs><rect width="900" height="660" fill="#fff"/><g font-family="Segoe UI,Arial,sans-serif"><text x="35" y="47" font-size="28" fill="#173d48">El rango elegido decide la prima y el descuento</text><rect x="95" y="95" width="480" height="200" fill="#f4e5d6"/><rect x="95" y="295" width="480" height="200" fill="#e9eff2"/><path d="M95 95 H575 M95 295 H575 M95 495 H575" stroke="#173d48" stroke-width="2"/><rect x="220" y="215" width="355" height="40" fill="#9b4e32"/><rect x="220" y="375" width="355" height="40" fill="#56747b"/><text x="610" y="102" font-size="24" fill="#173d48">120 · máximo H</text><text x="610" y="302" font-size="24" fill="#173d48">110 · equilibrio E</text><text x="610" y="503" font-size="24" fill="#173d48">100 · mínimo L</text><text x="112" y="148" font-size="24" fill="#173d48">PRIMA</text><text x="112" y="342" font-size="24" fill="#173d48">DESCUENTO</text><text x="245" y="243" font-size="23" fill="#fff">B · 112–114</text><text x="245" y="403" font-size="23" fill="#fff">A · 104–106</text><text x="95" y="552" font-size="25" fill="#173d48">E = (120 + 100) / 2 = 110</text><text x="95" y="589" font-size="21" fill="#173d48">Precios ficticios · B cumple ubicación; no prueba una ventaja.</text><text x="35" y="636" font-size="18" fill="#9b4e32">Esquema propio · no es una captura de mercado</text></g></svg>