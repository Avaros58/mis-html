<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 675" role="img" aria-label="Gestionar después de nueva información"><title>Gestionar después de nueva información</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#9b4e32"/></marker></defs><rect width="900" height="675" fill="#fff"/><g font-family="Segoe UI,Arial,sans-serif"><text x="35" y="47" font-size="28" fill="#173d48">Gestionar después de nueva información</text><rect x="70" y="85" width="760" height="110" rx="10" fill="#e9eff2"/><text x="90" y="122" font-size="25" fill="#173d48">1 · Antes de entrar</text><text x="90" y="163" font-size="21" fill="#173d48">Definir invalidación y calcular el tamaño.</text><path d="M450 204 L450 230" stroke="#9b4e32" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="70" y="245" width="760" height="110" rx="10" fill="#e9eff2"/><text x="90" y="282" font-size="25" fill="#173d48">2 · El precio avanza y retrocede</text><text x="90" y="323" font-size="21" fill="#173d48">Un beneficio pequeño no cambia por sí solo la estructura.</text><path d="M450 365 L450 391" stroke="#9b4e32" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="70" y="405" width="760" height="110" rx="10" fill="#e9eff2"/><text x="90" y="442" font-size="25" fill="#173d48">3 · Aparece la ruptura estructural prevista</text><text x="90" y="483" font-size="21" fill="#173d48">Evaluar el ajuste según la regla registrada de antemano.</text><text x="70" y="565" font-size="21" fill="#173d48">El nuevo stop también puede ejecutarse antes de una continuación.</text><text x="70" y="600" font-size="21" fill="#173d48">No hay una distancia universal ni ejecución garantizada.</text><text x="35" y="651" font-size="18" fill="#9b4e32">Esquema propio · no es una captura de mercado</text></g></svg>