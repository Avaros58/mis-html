<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img"><title>La coexistencia que propone</title><desc>Esquema editorial del argumento, no demostración causal.</desc><rect width="720" height="440" fill="#fafaf7"/><text x="24" y="42" font-family="Arial" font-size="24" font-weight="bold" fill="#142b3a">La coexistencia que propone</text><rect x="24" y="78" width="672" height="62" rx="10" fill="#e9eff2"/><text x="360" y="116" text-anchor="middle" font-family="Arial" font-size="21" fill="#142b3a">Reconocer diferencias persistentes</text><path d="M360 143v14m-6-5 6 6 6-6" stroke="#a3483f" fill="none" stroke-width="3"/><rect x="24" y="162" width="672" height="62" rx="10" fill="#e9eff2"/><text x="360" y="200" text-anchor="middle" font-family="Arial" font-size="21" fill="#142b3a">Aceptar seguridad y desarrollo ajenos</text><path d="M360 227v14m-6-5 6 6 6-6" stroke="#a3483f" fill="none" stroke-width="3"/><rect x="24" y="246" width="672" height="62" rx="10" fill="#e9eff2"/><text x="360" y="284" text-anchor="middle" font-family="Arial" font-size="21" fill="#142b3a">Gestionar relaciones y competencia</text><path d="M360 311v14m-6-5 6 6 6-6" stroke="#a3483f" fill="none" stroke-width="3"/><rect x="24" y="330" width="672" height="62" rx="10" fill="#e9eff2"/><text x="360" y="368" text-anchor="middle" font-family="Arial" font-size="21" fill="#142b3a">Limitar la confrontación directa</text><text x="24" y="428" font-family="Arial" font-size="15" fill="#526470">Relaciones expuestas en la entrevista · no prueba causal</text></svg>