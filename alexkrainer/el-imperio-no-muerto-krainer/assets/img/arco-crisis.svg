<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" width="900" height="410"
     role="img" aria-labelledby="titulo desc">
  <title id="titulo">El arco de crisis: del suministro exterior a la presión sobre la zona pivote</title>
  <desc id="desc">Diagrama en tres bandas: las potencias marítimas suministran medios a cuatro focos de
    crisis —Bálticos, Balcanes, Mediterráneo oriental y Corea—, y esos focos presionan sobre Rusia,
    identificada como zona pivote.</desc>

  <defs>
    <marker id="punta-roja" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#A3483F"/>
    </marker>
    <marker id="punta-gris" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#4A6472"/>
    </marker>
  </defs>

  <!-- Banda 1: potencias marítimas -->
  <rect x="250" y="14" width="400" height="60" rx="8" fill="#E9EFF2" stroke="#B9C8D0"/>
  <text x="450" y="40" text-anchor="middle" font-family="Montserrat, Segoe UI, sans-serif"
        font-size="14.5" font-weight="700" fill="#142B3A">Potencias marítimas</text>
  <text x="450" y="60" text-anchor="middle" font-size="11.5" fill="#4A6472">
    City de Londres · suministro, asesoramiento y munición
  </text>

  <!-- Banda 2: focos de crisis -->
  <g>
    <rect x="40" y="118" width="190" height="56" rx="7" fill="#F6EDD9" stroke="#C49A52"/>
    <text x="135" y="151" text-anchor="middle" font-size="13.5" font-weight="600" fill="#142B3A">Bálticos</text>

    <rect x="250" y="118" width="190" height="56" rx="7" fill="#F6EDD9" stroke="#C49A52"/>
    <text x="345" y="151" text-anchor="middle" font-size="13.5" font-weight="600" fill="#142B3A">Balcanes</text>

    <rect x="460" y="118" width="190" height="56" rx="7" fill="#F6EDD9" stroke="#C49A52"/>
    <text x="555" y="143" text-anchor="middle" font-size="13.5" font-weight="600" fill="#142B3A">Mediterráneo</text>
    <text x="555" y="161" text-anchor="middle" font-size="13.5" font-weight="600" fill="#142B3A">oriental</text>

    <rect x="670" y="118" width="190" height="56" rx="7" fill="#F6EDD9" stroke="#C49A52"/>
    <text x="765" y="151" text-anchor="middle" font-size="13.5" font-weight="600" fill="#142B3A">Corea</text>
  </g>

  <!-- Suministro a cada foco -->
  <g fill="none" stroke="#A3483F" stroke-width="1.6" marker-end="url(#punta-roja)">
    <path d="M400 76 L 152 114"/>
    <path d="M436 76 L 348 114"/>
    <path d="M464 76 L 552 114"/>
    <path d="M500 76 L 748 114"/>
  </g>

  <!-- Presión sobre la zona pivote -->
  <g fill="none" stroke="#4A6472" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#punta-gris)">
    <path d="M150 176 L 330 296"/>
    <path d="M345 176 L 405 296"/>
    <path d="M555 176 L 495 296"/>
    <path d="M750 176 L 570 296"/>
  </g>

  <!-- Banda 3: zona pivote -->
  <rect x="320" y="300" width="260" height="82" rx="10" fill="#142B3A"/>
  <text x="450" y="332" text-anchor="middle" font-family="Montserrat, Segoe UI, sans-serif"
        font-size="15.5" font-weight="700" fill="#FFFFFF">Rusia</text>
  <text x="450" y="354" text-anchor="middle" font-size="11.5" fill="#C49A52">zona pivote</text>
  <text x="450" y="371" text-anchor="middle" font-size="11.5" fill="#E9EFF2">guerra permanente para desgastarla</text>
</svg>
